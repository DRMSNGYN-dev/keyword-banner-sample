<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワードバナーサンプル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="search-area">
    <h1>キーワードバナー検索サンプル</h1>
    <p>気になるカテゴリを検索してください</p>
    <input type="text" id="keywordInput" placeholder="例：靴、バッグ、帽子">
</div>


<div id="banner">

    <h2 id="title"></h2>

    <p id="description"></p>

    <img id="bannerImage" alt="banner">

    <br>

    <a id="bannerLink" target="_blank">
        詳しく見る →
    </a>

</div>

<script src="script.js"></script>

</body>
</html>
